<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM — Шиномонтаж PRO</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<!-- значок на экране «Домой» планшета: CRM открывается во весь экран, без строки адреса -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="CRM PRO">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Внутренняя CRM мастерской. Светлый рабочий интерфейс в цветах сайта: чёрный, белый, фирменный красный. */
:root{
  --bg:#f3f2ef; --card:#fff; --ink:#111; --muted:#666; --line:#e2e0db; --soft:#ebe9e4;
  --dark:#0a0a0a; --accent:#d4202c; --accent-deep:#a3161f;
  --ok:#1f7a45; --ok-bg:#e3f3e9; --warn:#8a5a00; --warn-bg:#fdf0d5; --bad:#b3161f; --bad-bg:#fbe3e4; --info:#1a428f; --info-bg:#e3ebfa;
  --display:'Unbounded','Arial Black',Arial,sans-serif; --text:'Onest',Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:-0.03em;line-height:1.1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* вход */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:16px;background:var(--dark)}
.login form{width:100%;max-width:380px;background:var(--card);padding:32px 28px;display:grid;gap:16px}
.login h1{font-size:22px}
.login p{margin:0;color:var(--muted)}
.dots{display:flex;gap:16px;justify-content:center;margin:6px 0 2px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);transition:background .12s}
.dots i.on{background:var(--ink)}
.dots.bad i{border-color:var(--accent);background:var(--accent)}
.dots.bad{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@media (prefers-reduced-motion:reduce){.dots.bad{animation:none}.side,.scrim{transition:none!important}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:68px;border:0;border-radius:999px;background:var(--soft);font:600 26px/1 var(--display);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pad button:hover{background:#dedbd4}
.pad button:active{background:var(--ink);color:#fff}
.pad .k-back{background:none;font-size:24px}
.pad:has(button:disabled){opacity:.6}
.linkbtn{justify-self:center;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;letter-spacing:-0.02em}
.mark i{width:26px;height:26px;border-radius:50%;background:var(--accent);position:relative;flex:none}
.mark i::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--card)}

/* каркас */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--dark);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}
.side .mark i::after{background:var(--dark)}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:42px;padding:0 12px;border:0;border-radius:10px;background:none;color:#cfcfcf;text-align:left;font-weight:500;cursor:pointer}
.nav button:hover{background:#1c1c1c;color:#fff}
.nav button[aria-current=page]{background:#fff;color:var(--ink)}
.nav b{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;display:grid;place-items:center}
.side-foot{margin-top:auto;display:grid;gap:8px;color:#9a9a9a;font-size:13px}
.side-foot button{justify-self:start;border:0;background:none;color:#cfcfcf;text-decoration:underline;cursor:pointer;padding:0}
main{min-width:0;padding:24px 28px 80px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.top h1{font-size:26px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mbar,.scrim{display:none}
@media (max-width:860px){
  .app{display:block}
  /* на телефоне: верхняя полоса с кнопкой меню, разделы выезжают шторкой слева */
  .mbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;padding:8px 12px;min-height:56px}
  .mbar .mark i::after{background:var(--dark)}
  .mbar b{font-family:var(--display);font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .burger{position:relative;width:44px;height:44px;border:0;border-radius:12px;background:#1c1c1c;display:grid;place-content:center;gap:5px;cursor:pointer;flex:none}
  .burger i{display:block;width:20px;height:2px;border-radius:2px;background:#fff}
  .burger .dot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .side{position:fixed;top:0;left:0;bottom:0;z-index:40;width:min(82vw,300px);height:100dvh;overflow-y:auto;transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:none}
  .app.menu-open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.45)}
  .nav button{min-height:48px;font-size:16px}
  .scrim{display:block;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .28s}
  .app.menu-open .scrim{opacity:1;pointer-events:auto}
  main{padding:16px 12px 80px}
  .top h1{font-size:21px}
}

/* элементы */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--accent-deep)}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.sec:hover{background:#dedbd4}
.btn.dark{background:var(--dark)}
.btn.small{min-height:34px;padding:0 12px;font-size:13px}
.btn.link{background:none;color:var(--ink);padding:0 6px;text-decoration:underline}
.btn:disabled{opacity:.5;cursor:not-allowed}
.in,select.in,textarea.in{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea.in{min-height:72px;resize:vertical}
.in:focus{border-color:var(--ink);outline:none}
.in[readonly]{background:var(--soft);border-color:transparent;color:#444}
.tools .in{width:auto}
.search{min-width:220px}
.qbox{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;background:var(--card);border-radius:14px;padding:14px 16px}
.qbox>div:first-child{display:grid;gap:2px}
.qbox .small{font-size:13px}
.qbox .seg{flex-wrap:wrap;border-radius:18px}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;min-height:34px;padding:0 12px;cursor:pointer;font-weight:500}
.seg button[aria-pressed=true]{background:#fff;font-weight:600}
.card{background:var(--card);border-radius:14px;padding:18px}
.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@media (max-width:420px){.stats{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px}.stat b{font-size:20px}}
.stat{background:var(--card);border-radius:14px;padding:16px}
.stat span{display:block;color:var(--muted);font-size:13px}
.stat b{display:block;font-family:var(--display);font-size:24px;letter-spacing:-0.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.stat.hot{background:var(--accent);color:#fff}.stat.hot span{color:#ffe3e5}
.sec-title{font-size:16px;margin:28px 0 12px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--soft)}
.t-new{background:var(--accent);color:#fff}
.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-bad{background:var(--bad-bg);color:var(--bad)}
.t-info{background:var(--info-bg);color:var(--info)}
.plate{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.02em;white-space:nowrap}
input.plate{font-size:15px}
input.plate::placeholder{font-family:var(--text);font-weight:400;letter-spacing:0;color:#9a9a9a}

/* таблицы: на телефоне превращаются в карточки */
.tbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;background:#faf9f7;white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.lg-t{font-weight:600}
.lg-ch{display:block;margin-top:3px;font-size:13px;line-height:1.45}
.lg-ch i{font-style:normal;font-weight:600}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#faf9f7}
.tbl .r{text-align:right}
.tbl tfoot td{font-weight:700;background:#faf9f7}
.tbl select.in{min-height:34px;padding:4px 8px;width:auto}
@media (max-width:700px){
  .tbl,.tbl tbody,.tbl tr,.tbl td,.tbl tfoot{display:block;width:100%}
  .tbl thead{display:none}
  .tbl{background:none}
  .tbl tr{background:var(--card);border-radius:12px;margin-bottom:8px;padding:6px 0}
  .tbl td{border:0;display:flex;justify-content:space-between;gap:12px;padding:6px 14px;text-align:right}
  .tbl td::before{content:attr(data-l);color:var(--muted);font-size:13px;text-align:left;flex:none}
  .tbl td.r{text-align:right}
  .tbl td:empty{display:none}
}

/* расписание */
.slots{display:grid;gap:6px}
.slot{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:stretch}
.slot time{font-weight:600;font-variant-numeric:tabular-nums;padding-top:10px}
.slot .cell{display:grid;gap:6px;min-height:44px}
.slot .free{border:1px dashed #cfccc5;border-radius:10px;background:none;color:var(--muted);cursor:pointer;text-align:left;padding:0 12px}
.slot .free:hover{border-color:var(--ink);color:var(--ink)}
.bk{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--card);border-radius:10px;padding:10px 12px;border:0;text-align:left;cursor:pointer;width:100%}
.bk:hover{outline:2px solid var(--ink)}
.bk.cancel{opacity:.5}
.lunch .slot time{color:var(--muted)}

/* окно формы */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.55)}
.sheet{width:100%;max-width:640px;max-height:calc(100dvh - 32px);overflow:auto;background:var(--card);border-radius:16px;padding:22px}
.sheet h2{font-size:19px;margin-bottom:16px;padding-right:40px}
.sheet .x{position:sticky;top:0;float:right;width:36px;height:36px;border:0;border-radius:50%;background:var(--soft);font-size:22px;line-height:1;cursor:pointer;margin:-6px -6px 0 0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.f{display:grid;gap:5px;align-content:start}
.f.wide{grid-column:1/-1}
.f>span{font-size:13px;font-weight:600}
.f small{color:var(--muted)}
.f .chk{display:flex;align-items:center;gap:10px;min-height:42px}
.f .chk input{width:20px;height:20px;accent-color:var(--accent)}
.hint{grid-column:1/-1;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:14px}
.sumline{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-radius:10px;background:var(--dark);color:#fff}
.sumline b{font-family:var(--display);font-size:22px}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:20px}
.acts div{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--bad);font-weight:600;font-size:14px;margin-top:10px}
/* услуги внутри одной работы */
.lines{grid-column:1/-1;display:grid;gap:8px}
.lines>span{font-size:13px;font-weight:600}
.wl{display:grid;grid-template-columns:minmax(0,1fr) 84px 112px 96px 36px;gap:8px;align-items:end;padding:10px;border-radius:12px;background:#faf9f7}
.wl .ws{display:grid;align-content:center;min-height:42px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.wl-del{width:36px;height:42px;border:0;border-radius:10px;background:var(--soft);font-size:20px;line-height:1;cursor:pointer}
.wl-del:hover{background:#dedbd4}
.lines .btn{justify-self:start}
/* выбор кнопками: оплата, сезон, статус, мастер, частые услуги */
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{position:relative;display:inline-flex;cursor:pointer;border:0;padding:0;background:none;font:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.chip input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.chip span{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--soft);font-weight:600;white-space:nowrap}
.chip input:checked+span{background:var(--ink);color:#fff}
.chip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.chip:active span{background:#d6d3cc}
.chip input:disabled+span,.chip:disabled span{opacity:.5;cursor:default}
.f .chips{margin-top:2px}
.f input+.chips{margin-top:8px}
.f input+.chips .chip span{min-height:40px;padding:0 14px;font-weight:500;font-size:15px}
.chips.quick{padding:2px 0 4px}
.chips.quick .chip span{min-height:40px;padding:0 14px;font-weight:500;font-size:15px;background:#fff;border:1px solid var(--line)}
.refresh{border:0;background:none;color:#cfcfcf;cursor:pointer;padding:0;text-decoration:underline;justify-self:start}
.mbar .refresh{margin-left:auto;width:48px;height:48px;border-radius:12px;background:#1c1c1c;color:#fff;font-size:22px;text-decoration:none;flex:none}
/* количество с кнопками − и + по бокам, под палец */
.stepper{display:grid;grid-template-columns:44px minmax(36px,1fr) 44px;gap:6px;align-items:center}
.stepper .in{text-align:center;padding-left:4px;padding-right:4px;font-weight:700;-moz-appearance:textfield}
.stepper .in::-webkit-outer-spin-button,.stepper .in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper button{height:44px;border:0;border-radius:999px;background:var(--soft);font:600 24px/1 var(--text);cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.stepper button:active{background:var(--ink);color:#fff}
.stepper button:disabled{opacity:.4;cursor:default}
@media (max-width:560px){.wl{grid-template-columns:1fr 1fr}.wl .f:first-child{grid-column:1/-1}.wl-del{justify-self:end}}
@media (max-width:560px){.modal{padding:0;align-items:end}.sheet{border-radius:16px 16px 0 0;max-height:94dvh}.fields{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;background:var(--dark);color:#fff;padding:12px 18px;border-radius:999px;font-weight:500}
.note{padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);margin-bottom:16px}

/* ===== планшет и сенсорный экран =====
   Всё под палец: кнопки и поля от 44–48px, текст не мельче 13px, отклик на нажатие вместо наведения. */
button,a,select,input,textarea,label,.tbl tr.click{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,.btn,.seg,.nav,.pad,.tag{-webkit-user-select:none;user-select:none}
.btn:active{transform:scale(.97)}
.btn.sec:active,.seg button:active{background:#d6d3cc}
.tbl tr.click:active td{background:var(--soft)}
.bk:active{background:var(--soft)}
.slot .free:active{background:var(--soft);color:var(--ink)}
.nav button:active{background:#262626}
.wl-del:active,.sheet .x:active{background:#d6d3cc}
@media (hover:none){
  /* на сенсорном экране «наведение» залипает после касания — убираем его */
  .btn:hover{background:var(--accent)}.btn.sec:hover{background:var(--soft)}.btn.dark:hover{background:var(--dark)}.btn.link:hover{background:none}
  .nav button:hover{background:none;color:#cfcfcf}.nav button[aria-current=page]:hover{background:#fff;color:var(--ink)}
  .tbl tr.click:hover td{background:none}.bk:hover{outline:none}
  .slot .free:hover{border-color:#cfccc5;color:var(--muted)}
  .pad button:hover{background:var(--soft)}.wl-del:hover{background:var(--soft)}
}
/* до 1280px (планшеты в любой ориентации) и на любом сенсорном экране */
@media (pointer:coarse),(max-width:1280px){
  body{font-size:16px}
  .btn{min-height:48px;padding:0 20px;font-size:16px}
  .btn.small{min-height:44px;padding:0 16px;font-size:15px}
  .btn.link{padding:0 10px}
  .in,select.in,textarea.in{min-height:48px;padding:10px 14px;font-size:16px;border-radius:12px}
  textarea.in{min-height:96px}
  .tbl select.in{min-height:44px;padding:6px 10px}
  .seg{padding:4px}
  .seg button{min-height:44px;padding:0 16px;font-size:15px}
  .nav{gap:4px}
  .nav button{min-height:50px;font-size:16px;padding:0 14px}
  .nav b{min-width:24px;height:24px;font-size:13px}
  .side-foot{font-size:14px;gap:4px}
  .side-foot button,.side-foot a{display:inline-flex;align-items:center;min-height:44px}
  .tbl th{font-size:13px;padding:12px 14px}
  .tbl td{padding:14px}
  .tag{font-size:13px;padding:4px 12px}
  .plate{font-size:14px}
  .stat span,.qbox .small,.f small{font-size:14px}
  .f>span,.lines>span{font-size:14px}
  .hint{font-size:15px}
  .sheet{max-width:720px;padding:24px}
  .sheet h2{font-size:21px;padding-right:56px}
  .sheet .x{width:48px;height:48px;font-size:26px}
  .fields{gap:16px 18px}
  .f .chk{min-height:48px;font-size:16px}
  .f .chk input{width:28px;height:28px}
  /* строка услуги: название во всю ширину, ниже количество с − и +, цена, сумма */
  .wl{grid-template-columns:1fr 1fr 1fr 48px;gap:10px;padding:12px}
  .wl .f:first-child{grid-column:1/-1}
  .stepper{grid-template-columns:52px minmax(40px,1fr) 52px}
  .stepper button{height:48px;font-size:26px}
  .wl .ws{min-height:48px}
  .wl-del{width:48px;height:48px;font-size:24px;border-radius:12px}
  /* «Сохранить» и «Отмена» всегда под рукой, даже в длинной форме */
  .acts{position:sticky;bottom:-24px;z-index:2;margin:20px 0 -24px;padding:14px 0 24px;background:var(--card);gap:12px}
  .acts div{gap:10px}
  .slots{gap:8px}
  .slot{grid-template-columns:70px 1fr}
  .slot time{padding-top:14px;font-size:16px}
  .slot .cell{min-height:52px}
  .slot .free{min-height:52px;font-size:15px}
  .bk{padding:14px;gap:8px 14px;border-radius:12px}
  .toast{bottom:28px;padding:14px 22px;font-size:16px}
  .sec-title{font-size:17px}
  .tbl a.num{display:inline-flex;align-items:center;min-height:44px}
  [data-shift]{min-width:52px;font-size:20px}
  /* экран входа: клавиши крупнее, места между ними больше — меньше промахов */
  .login form{max-width:420px;padding:32px;gap:18px}
  .login h1{font-size:24px}
  .dots{gap:20px;margin:8px 0 4px}
  .dots i{width:20px;height:20px}
  .pad{gap:14px}
  .pad button{height:78px;font-size:30px}
  .pad button:active{transform:scale(.95)}
  .linkbtn{min-height:48px;padding:8px 16px;font-size:16px}
}
/* планшет в альбомной ориентации: меню поуже, больше места под таблицы */

</div>

<script>
(function () {

  var MONG = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  // покраска дисков
  var RADII = ['R13', 'R14', 'R15', 'R16', 'R17', 'R18', 'R19', 'R20', 'R21', 'R22'];
  var PSTATUS = ['Принято', 'В работе', 'Готово', 'Выдано'];
  // частые цвета порошковой покраски: [название, цвет кружка]
  var COLORS = [['Серебро', '#c9ccd1'], ['Графит', '#4a4d52'], ['Чёрный глянец', '#0b0b0b'], ['Чёрный мат', '#2a2a2a'], ['Белый', '#f7f7f5'], ['Золото', '#c9a24a'], ['Бронза', '#8c6a3f'], ['Красный', '#c3202a']];
  var DOW = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  var DOWF = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
  var MON = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  var SLOTS = []; for (var hr = 8; hr < 23; hr++) { SLOTS.push(p2(hr) + ':00'); SLOTS.push(p2(hr) + ':30'); }

  var S = { role: null, D: null, view: 'today', f: {} };
  var VIEWS = [
    ['today', 'Сегодня'], ['bookings', 'Запись'], ['schedule', 'Расписание'], ['jobs', 'Работы'], ['history', 'История'],
    ['clients', 'Клиенты', true], ['storage', 'Хранение', true], ['tires', 'Б/у шины', true], ['paint', 'Покраска', true], ['companies', 'Безнал', true], ['report', 'Отчёт', true], ['prices', 'Прайс'], ['staff', 'Сотрудники', true], ['log', 'Журнал', true]
  ];

  // ---------- мелочи
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function h(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽'; }
  function today() { return new Date(Date.now() + 3 * 3600e3).toISOString().slice(0, 10); } // Крым, UTC+3
  function addDays(iso, n) { var d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }

      .then(function (r) {

  }
  var ERR = {
    'db-not-configured': 'База данных ещё не подключена. Нужен хостинг с PostgreSQL — см. инструкцию в CLAUDE.md.',
    'auth-not-configured': 'Пароли CRM не заданы на сервере (CRM_OWNER_PASSWORD, CRM_SECRET).',
    'too-many': 'Слишком много попыток. Подождите 15 минут.',
    'pin-locked': 'Вход по коду временно закрыт: было много неверных кодов. Подождите (до суток) или войдите по паролю владельца.',
    'password': 'Неверный пароль.',
    'plate': 'Клиент с таким госномером уже есть в базе.',

    'in-invoice': 'Эта работа уже в счёте. Сумму, оплату и компанию можно менять, только удалив счёт (раздел «Безнал»).'
  };
  var FIELD = { plate: 'госномер', date: 'дата', time: 'время', service: 'услуга', name: 'название', received: 'дата приёма', qty: 'количество', price: 'цена', adjust: 'скидка / доплата (сумма работы не может быть меньше нуля)', cost: 'стоимость', until: 'хранить до', issued: 'дата выдачи', masterPct: 'процент мастера', pin: 'код (ровно 4 цифры)', items: 'услуги', master: 'мастер', size: 'размер', sold: 'продано (не больше принятого)', sellQty: 'сколько шин (не больше остатка)', phone: 'телефон', color: 'цвет', prepaid: 'аванс (не больше цены)', img: 'фото (не больше 12 на заказ)', company: 'компания (для безнала её нужно выбрать)', jobs: 'работы в счёте' };
  function errText(e) { if (e.code === 'field') return 'Проверьте поле «' + (FIELD[e.field] || e.field) + '».'; return ERR[e.code] || 'Не получилось: нет связи с сервером.'; }

  function load(quiet) {
    return api('load').then(function (j) {

  }
  function showLogin() { $('app').hidden = true; $('login').hidden = false; closeModal(); pinReset(); }

  // вход: экранная клавиатура, после 4-й цифры код уходит сам; длинный пароль — по ссылке «Войти по паролю»
  var pin = '', pinBusy = false;

  function pinReset() { pin = ''; $('dots').classList.remove('bad'); pinDraw(); }
  function pinKey(k) {

    return api('save', { coll: coll, id: id || null, data: data }).then(function (j) {

  function clientBy(pl) { if (!pl) return null; return S.D.clients.find(function (c) { return c.plate === pl; }) || null; }

  function stPaidOn(d) { return S.D.storage.filter(function (x) { return x.paid && (x.paidOn || x.received) === d; }); }

  function stStatus(s) {

  }
  var STAG = { 'Принято': 't-info', 'В работе': 't-warn', 'Готово': 't-ok', 'Новая': 't-new', 'Записан': 't-info', 'Приехал': 't-ok', 'Не приехал': 't-bad', 'Отменён': '', 'Выдано': '', 'Просрочено': 't-bad', 'Скоро срок': 't-warn', 'На складе': 't-ok' };
  function tag(t) { return '<span class="tag ' + (STAG[t] || '') + '">' + h(t) + '</span>'; }
  function byDateTime(a, b) { return ((a.date || '9999') + (a.time || '99')).localeCompare((b.date || '9999') + (b.time || '99')) || a.id - b.id; }

  function nextTag() { return S.D.storage.reduce(function (m, s) { return Math.max(m, s.id); }, 0) + 1; }

  // ---------- покраска дисков (только владелец; деньги — отдельная касса, мастерам не идут)

  function pLeft(o) { return Math.max(0, (o.price || 0) - (o.prepaid || 0)); }
  function colorHex(name) { var n = String(name || '').trim().toLowerCase(), c = COLORS.find(function (x) { return x[0].toLowerCase() === n; }); return c ? c[1] : ''; }
  function swatch(name) { var c = colorHex(name); return c ? '<i class="sw" style="background:' + c + '"></i>' : ''; }
  function pDesc(o) { return o.radius + ' · ' + (o.qty || 4) + ' шт.' + (o.turn ? ' · проточка' : ''); }
  // цена по прайсу CRM: там она за комплект из 4 дисков, за 1–3 диска — пропорционально
  function pFind(prefix, r) {

  }
  function pCalc(r, qty, turn) {
    var q = Number(qty) || 4, paint = Math.round(pFind('Покраска дисков', r) / 4 * q), tp = turn ? Math.round(pFind('Алмазная проточка', r) / 4 * q) : 0;
    return { paint: paint, turn: tp, sum: paint + tp };
  }
  // деньги покраски по дням: аванс — в день, когда внесли, остаток — в день выдачи
  function paintCash() {
    var out = [];
    (S.D.paint || []).forEach(function (o) {
      if (o.prepaid) out.push({ date: o.prepaidOn || o.received, sum: o.prepaid, pay: o.prepaidBy || 'Нал', k: 'a' });
      if (o.status === 'Выдано' && pLeft(o)) out.push({ date: o.issued, sum: pLeft(o), pay: o.pay || 'Нал', k: 'v' });

  }

  // ---------- каркас
  function render() {

  // ---------- разделы
  var V = {};

  V.today = function () {

    var bt = S.D.bookings.filter(function (b) { return b.date === t && b.status !== 'Отменён'; }).sort(byDateTime);

    var count = function (x) { return st.filter(function (s) { return s === x; }).length; };
    var stats = [
      ['Записей на сегодня', bt.length], ['Машин обслужено сегодня', cars(jt)]
    ];
    if (owner()) stats.push(['Касса сегодня', money(sum(jt, 'sum'))], ['Мастеру сегодня', money(toMaster(jt))]);
    var out = top('Сегодня, ' + dm(t) + ' · ' + DOWF[dow(t)], '<button class="btn" type="button" data-new="bookings">+ Запись</button><button class="btn dark" type="button" data-new="jobs">+ Работа</button>' +

    if (fresh.length) {

        fresh.map(function (b) {
          var r = [stamp(b.created), h(who(b)), phoneLink(phoneOf(b)), h(b.service), b.date ? dm(b.date) + (b.time ? ' ' + b.time : '') : '<span class="muted">не указал</span>', '<button class="btn small" type="button" data-edit="bookings" data-id="' + b.id + '">Разобрать</button>'];

      (owner() ? '<div class="stat"><span>Касса за месяц</span><b>' + money(sum(jm, 'sum')) + '</b></div><div class="stat"><span>Мастеру за месяц</span><b>' + money(toMaster(jm)) + '</b></div>' : '') +
      '<div class="stat"><span>Клиентов в базе</span><b>' + S.D.clients.length + '</b></div>' +

  // очередь, которую видят клиенты на сайте; старше 3 часов сайт её не показывает

  function queueBox(gap) {

  function bookingTable(list, noDate) {

  };
  function seg(key, val, opts) { return '<div class="seg" role="group">' + opts.map(function (o) { return '<button type="button" data-seg="' + key + '" data-v="' + o[0] + '" aria-pressed="' + (val === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div>'; }

  V.schedule = function () {

  // ---------- история машины (11.11.2026): все работы, записи, хранение и покраска одной машины и сколько клиент заплатил всего.
  // Машину узнаём по госномеру и телефону: запись с номером и телефоном связывает их вместе.
  // У работ без номера (в форме только марка) ключ — марка, поэтому одинаковые марки без номера попадают в одну историю.
  function hRecs() {
    var used = {}; S.D.jobs.forEach(function (j) { if (j.booking) used[j.booking] = 1; });
    var bkBy = {}; S.D.bookings.forEach(function (b) { bkBy[b.id] = b; });
    var out = [];
    S.D.jobs.forEach(function (j) {
      var b = j.booking ? bkBy[j.booking] : null;
      out.push({ k: 'job', o: j, date: j.date, plate: j.plate || (b && b.plate) || '', car: j.car || carOf(j) || (b && carOf(b)) || '', phone: phoneOf(j) || (b && phoneOf(b)) || '', name: who(j) || (b && who(b)) || '', sum: j.sum || 0 });
    });
    S.D.bookings.forEach(function (b) {
      if (used[b.id]) return; // запись уже превратилась в работу
      out.push({ k: 'bk', o: b, date: b.date || (b.created || '').slice(0, 10), plate: b.plate || '', car: carOf(b), phone: phoneOf(b), name: who(b), sum: 0 });
    });
    (S.D.storage || []).forEach(function (s) {
      out.push({ k: 'st', o: s, date: s.received, plate: s.plate || '', car: carOf(s), phone: phoneOf(s), name: who(s), sum: s.paid ? s.cost || 0 : 0 });

  // ---------- фото дисков: сжимаем на планшете до 1280px, чтобы база не разрасталась
  function shrink(file) {

      var fr = new FileReader();
      fr.onerror = no;
      fr.onload = function () {
        var img = new Image();
        img.onerror = no;
        img.onload = function () {
          var k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          var q = 0.72, url = c.toDataURL('image/jpeg', q);
          while (url.length > 600000 && q > 0.3) { q -= 0.12; url = c.toDataURL('image/jpeg', q); }
          ok(url);
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

    var form = b.closest('form'); if (!form) return;
    var inp;
    if (b.dataset.fill) inp = form.elements[b.dataset.fill];
    else if (b.dataset.svc) {
      inp = Array.prototype.find.call(form.querySelectorAll('[name=l_service]'), function (x) { return !x.value.trim(); });
      if (!inp && $('addLine')) { $('addLine').click(); inp = $('lines').lastElementChild.querySelector('[name=l_service]'); }
      if (inp) inp.blur();
    }
    if (!inp || inp.readOnly || inp.disabled) return;
    inp.value = b.dataset.fill ? b.dataset.v : b.dataset.svc;
    inp.dispatchEvent(new Event('input', { bubbles: true }));
  });
  // фото дисков: убрать новое, удалить сохранённое, открыть крупно
  $('modal').addEventListener('click', function (e) {
    if (!M || M.coll !== 'paint') return;
    var b = e.target.closest('[data-phdrop],[data-phdel],[data-zoom]'); if (!b) return;
    if (b.dataset.phdrop != null) { M.pending.splice(Number(b.dataset.phdrop), 1); pPhotosDraw(); return; }
    if (b.dataset.zoom != null) {
      var z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = '<img alt="Фото диска">'; z.firstChild.src = b.src;
      z.onclick = function () { z.remove(); }; document.body.appendChild(z); return;
    }
    if (!confirm('Удалить это фото?')) return;
    var mm = M, phid = Number(b.dataset.phdel);
    api('photo-del', { paint: mm.id, id: phid }).then(function (j) {
      mm.saved = mm.saved.filter(function (p) { return p.id !== phid; }); setPaint(j.doc); if (M === mm) pPhotosDraw();
    }).catch(function (er) { toast(errText(er)); });
  });
  // касание мимо окна закрывает его, только если в форме ещё ничего не меняли — чтобы случайно не потерять введённое
  $('modal').addEventListener('input', function () { if (M) M.dirty = true; });
  $('modal').addEventListener('click', function (e) { if (e.target === $('modal') && !(M && M.dirty)) closeModal(); });

  // свежие данные (новые заявки с сайта) — раз в минуту и при возврате на вкладку
  setInterval(function () { if (S.D && !M && !document.hidden) load(true); }, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.D && !M) load(true); });

  load();
})();
</script>
