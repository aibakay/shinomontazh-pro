# Шиномонтаж PRO: nginx перед node (порт 3000). Заголовки — как в vercel.json.
# После появления домена: server_name <домен>; и certbot --nginx -d <домен>
map $uri $shino_csp {
  ~^/crm/  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";
  default  "";
}
limit_req_zone $binary_remote_addr zone=shino_api:10m rate=10r/s;

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  server_tokens off;
  client_max_body_size 2m;
  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/plain;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy $shino_csp always;

  location /.well-known/acme-challenge/ { root /var/www/html; }

  location /api/ {
    limit_req zone=shino_api burst=30 nodelay;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/shino_proxy.conf;
  }
  location /photos/ {
    expires 7d;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/shino_proxy.conf;
  }
  location / {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/shino_proxy.conf;
  }
}
